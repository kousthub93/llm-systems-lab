name: 03-evals

on:
  pull_request:
    paths:
      - "03-evals/**"
      - ".github/workflows/03-evals.yml"
  push:
    branches: [main]
    paths:
      - "03-evals/**"
      - ".github/workflows/03-evals.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 03-evals
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Unit tests
        run: pytest -q
      # The recorded outputs are fixed, so this step catches changes to the metric
      # code itself: if scoring changes, the re-scored numbers drift from the baseline.
      - name: Re-score recorded outputs against the baseline
        if: hashFiles('03-evals/data/project2_generations.jsonl') != ''
        run: ragevals check data/project2_generations.jsonl --baseline baselines/project2.json --tolerance 0.002 --rel-tolerance 0.01
